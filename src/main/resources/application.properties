spring.application.name=pizzaria
# URL de conexão com o PostgreSQL (porta padrão é 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/pizzaria

# Credenciais de acesso
spring.datasource.username=postgres
spring.datasource.password=123456

# Driver do PostgreSQL (opcional no Spring Boot moderno, mas boa prática explicitar)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA (Opcional, mas comum)
# Cria ou atualiza as tabelas automaticamente com base nas suas entidades
spring.jpa.hibernate.ddl-auto=update

# Dialeto do banco de dados (o Spring Boot geralmente detecta sozinho, mas você pode definir)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exibe as consultas SQL no console para facilitar o debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true